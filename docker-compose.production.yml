# 운영 배포 구성 (신규 독립 서버). 실제 배포·DNS·인증서 발급은 별도 승인 후 수행.
# 사용: docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
# - PostgreSQL / Redis 는 내부 네트워크(backend)에만 연결되며 호스트 포트를 노출하지 않는다.
# - 외부 노출은 reverse proxy(80/443) 하나뿐이다.
name: oogam
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  WEB_ORIGINS: ${WEB_ORIGINS}
  COOKIE_SECURE: "true"
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
  IP_HASH_SALT: ${IP_HASH_SALT}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_LOCAL_DIR: /app/apps/api/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_BUCKET: ${S3_BUCKET:-oogam}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [frontend]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL}
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    image: oogam-api:latest
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    environment: *app-env
    volumes: [uploads:/app/apps/api/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [frontend, backend]

  collab:
    image: oogam-api:latest
    restart: unless-stopped
    command: ["node", "dist/collab.js"]
    environment: *app-env
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(4001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend, backend]

  worker:
    image: oogam-api:latest
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *app-env
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:
  uploads:
  certbot-www:
