# 개발용 인프라: PostgreSQL + Redis + MinIO(S3 호환). 앱은 로컬에서 pnpm dev 로 실행.
# 사용: docker compose up -d
name: oogam-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oogam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oogam_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-oogam}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oogam}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-oogam-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-oogam-dev-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    profiles: ["s3"]
volumes:
  pgdata:
  redisdata:
  miniodata:
