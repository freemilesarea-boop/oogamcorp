name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oogam, POSTGRES_PASSWORD: oogam_ci_pw, POSTGRES_DB: oogam_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oogam" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://oogam:oogam_ci_pw@localhost:5432/oogam_test?schema=public
      TEST_DATABASE_URL: postgresql://oogam:oogam_ci_pw@localhost:5432/oogam_test?schema=public
      REDIS_URL: redis://localhost:6379
      API_INTERNAL_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm --filter @oogam/api prisma:generate
      - run: pnpm --filter @oogam/api exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @oogam/shared test
      - run: pnpm --filter @oogam/api test
      - run: pnpm build
