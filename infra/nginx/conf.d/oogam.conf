# oogam.co.kr — HTTPS-ready 구성.
# 인증서 발급 전에는 80 포트만 사용하고, 발급 후(예: certbot) 443 블록의 인증서 경로를 맞춘 뒤 활성화한다.
# 실제 DNS/인증서 작업은 별도 승인 후 진행.

upstream web    { server web:3000; keepalive 32; }
upstream api    { server api:4000; keepalive 32; }
upstream collab { server collab:4001; }

server {
  listen 80;
  server_name oogam.co.kr www.oogam.co.kr;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  # 인증서 발급 후 아래 return 을 활성화하고, 그 아래 임시 프록시 블록은 제거한다.
  # return 301 https://oogam.co.kr$request_uri;

  include /etc/nginx/conf.d/oogam.locations;
}

