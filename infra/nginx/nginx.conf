user nginx;
worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 30m;

  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent","rid":"$request_id"}';
  access_log /var/log/nginx/access.log json;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # 요청 제한 초과는 503 이 아닌 429(Too Many Requests)로 응답
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
