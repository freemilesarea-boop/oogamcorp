# OOGAM Preview (대표 검수용) — 정식 서비스 아님
# - 모든 요청에 HTTP Basic 인증 (Nginx 1차 관문) + 애플리케이션 로그인·MFA (2차)
# - 검색엔진 색인 차단: X-Robots-Tag + robots.txt 전체 차단
upstream pv_web    { server web:3000; keepalive 16; }
upstream pv_api    { server api:4000; keepalive 16; }
upstream pv_collab { server collab:4001; }

# 80: HTTPS 로 전환 (인증서 발급용 ACME 경로만 예외)
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/preview.crt;
  ssl_certificate_key /etc/nginx/certs/preview.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:PVSSL:5m;

  auth_basic "OOGAM Preview";
  auth_basic_user_file /etc/nginx/preview/htpasswd;

  include /etc/nginx/conf.d/preview.locations;
}

# 8080: 이 서버 내부 전용(compose 가 127.0.0.1 에만 바인딩) — 세션 소유자의 앱 내 미리보기용.
# 외부에서 접근할 수 없으며 애플리케이션 로그인·MFA 는 그대로 적용된다.
server {
  listen 8080;
  server_name _;
  include /etc/nginx/conf.d/preview.locations;
}
